<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Scheme Generator</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="controls">
        <input type="color" id="seedColor" value="#f55a5a" />
        <select id="schemeMode">
          <option value="monochrome">Monochrome</option>
          <option value="monochrome-dark">Monochrome-dark</option>
          <option value="monochrome-light">Monochrome-light</option>
          <option value="analogic">Analogic</option>
          <option value="complement">Complement</option>
          <option value="analogic-complement">Analogic-complement</option>
          <option value="triad">Triad</option>
        </select>
        <button id="getScheme">Get color scheme</button>
      </div>
      <div class="color-display" id="colorDisplay"></div>
    </div>

    <!-- Theme FAB -->
    <div class="theme-fab-container" id="themeFab">
      <div class="theme-options">
        <button class="theme-option-btn" data-theme="light" title="Light Mode">
          <span class="theme-icon">☀️</span>
          <span class="theme-label">Light</span>
        </button>
        <button class="theme-option-btn" data-theme="dark" title="Dark Mode">
          <span class="theme-icon">🌙</span>
          <span class="theme-label">Dark</span>
        </button>
        <button
          class="theme-option-btn"
          data-theme="system"
          title="System Default"
        >
          <span class="theme-icon">💻</span>
          <span class="theme-label">System</span>
        </button>
      </div>
      <button class="theme-fab-btn" id="themeFabBtn" title="Change Theme">
        <span class="fab-icon" id="fabIcon">🎨</span>
      </button>
    </div>

    <div class="copied-toast" id="toast">Copied to clipboard!</div>

    <script type="module" src="index.js"></script>
  </body>
</html>
